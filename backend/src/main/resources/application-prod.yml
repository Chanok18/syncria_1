server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/syncria_db}
    username: ${DATABASE_USERNAME:syncria_user}
    password: ${DATABASE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

  devtools:
    restart:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
    cookie-max-age: 86400
    cookie-secure: true
    cookie-domain: ${COOKIE_DOMAIN:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
