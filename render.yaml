# Render Infrastructure as Code - Syncria
# Este archivo es opcional pero facilita el deploy

services:
  # Backend - Spring Boot
  - type: web
    name: syncria-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: syncria-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: syncria-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: syncria-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Configurar manualmente despues del deploy del frontend
      - key: COOKIE_DOMAIN
        sync: false  # Configurar manualmente despues del deploy del frontend
      - key: COOKIE_SECURE
        value: "true"
    healthCheckPath: /api/v1/health

  # Frontend - Static Site
  - type: static_site
    name: syncria-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false  # Configurar con la URL del backend

databases:
  # PostgreSQL Database
  - name: syncria-db
    databaseName: syncria_db
    user: syncria_user
    plan: free
